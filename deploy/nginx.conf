# Боевой адрес Iskra Web. Кладётся в /etc/nginx/sites-available/iskra-web, ссылкой — в
# sites-enabled. Сертификат — certbot (см. deploy/README.md).
#
# /srv/iskra-web/releases/<коммит>/site/          — dist/ без служебных файлов
# /srv/iskra-web/releases/<коммит>/headers.nginx  — заголовки из security-headers.ts
# /srv/iskra-web/current -> releases/<коммит>     — переключает деплой
#
# Заголовки безопасности здесь не пишутся руками: их источник — security-headers.ts,
# сборка кладёт их в headers.nginx, деплой — рядом с сайтом, и `nginx -s reload` их подхватывает.
#
# Ловушка nginx: `add_header` внутри location отменяет все `add_header` уровнем выше. Поэтому
# заголовки подключаются в каждый location, а не один раз на сервер.

server {
	listen 80;
	listen [::]:80;
	server_name web.iskra.wtf;
	return 301 https://$host$request_uri;
}

server {
	# `http2` в listen — для nginx старше 1.25.1 (отдельной директивы `http2 on` там нет); в новых
	# это лишь предупреждение об устаревшем способе.
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name web.iskra.wtf;

	ssl_certificate /etc/letsencrypt/live/web.iskra.wtf/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/web.iskra.wtf/privkey.pem;

	root /srv/iskra-web/current/site;
	server_tokens off;

	# Rust-крипто в WASM и бандл matrix-js-sdk жмутся в разы.
	gzip on;
	gzip_types text/css application/javascript text/javascript application/json application/wasm
		application/manifest+json image/svg+xml;

	# Файлы с хэшем в имени не меняются никогда.
	location /assets/ {
		include /srv/iskra-web/current/headers.nginx;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;

		# И `.wasm` в mime.types может не быть: тогда nginx отдаёт octet-stream, и браузер не
		# компилирует Rust-крипто («Incorrect response MIME type. Expected 'application/wasm'»).
		# `add_header` во вложенном location не наследуется — заголовки повторены.
		location ~ \.wasm$ {
			include /srv/iskra-web/current/headers.nginx;
			add_header Strict-Transport-Security "max-age=31536000" always;
			add_header Cache-Control "public, max-age=31536000, immutable" always;
			default_type application/wasm;
			try_files $uri =404;
		}
	}

	# В mime.types манифеста нет.
	location = /manifest.webmanifest {
		include /srv/iskra-web/current/headers.nginx;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header Cache-Control "no-cache" always;
		default_type application/manifest+json;
	}

	# Оболочка — index.html, sw.js, иконки — сверяется при каждом заходе: иначе новая версия
	# не доедет до тех, у кого старый sw.js в кэше браузера. Адрес на History API: любой путь
	# приложения отдаёт index.html.
	location / {
		include /srv/iskra-web/current/headers.nginx;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header Cache-Control "no-cache" always;
		try_files $uri /index.html;
	}
}
