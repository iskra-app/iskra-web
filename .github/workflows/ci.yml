name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm e2e
        env:
          PW_ENGINES: ${{ matrix.engine }}
      # Артефакты из CI достать не всегда можно — снимок страницы на момент падения
      # (дерево доступности) печатается прямо в лог.
      - name: Снимки упавших тестов
        if: failure()
        run: |
          for f in test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            sed -n '/^# Page snapshot/,$p' "$f" | head -150
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-${{ matrix.engine }}
          path: test-results/

  # Ночная сборка на GitHub Pages: каждый зелёный пуш в dev, по адресу
  # https://<владелец>.github.io/iskra-web/. Pages не дают своих заголовков — CSP уходит
  # тегом <meta> (без frame-ancestors и COOP; см. security-headers.ts). Для боевого адреса
  # это не годится, для «попробовать dev» — да.
  nightly:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # Pages ещё не включены (или недоступны для приватного репозитория на бесплатном
    # плане) — это не повод красить CI: провал виден в самой job.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ISKRA_BASE: /${{ github.event.repository.name }}/
          ISKRA_META_CSP: '1'
      # Имя с номером попытки: повтор job в том же запуске иначе находит два артефакта
      # github-pages (от первой попытки и от этой), и deploy-pages отказывается выбирать.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # Сборка из main — на https://iskra.swag.moscow/web/. У репозитория одни Pages, и они
  # заняты ночной сборкой, поэтому эта кладётся папкой web/ в репозиторий сайта
  # (iskra-app/iskra.swag.moscow) по deploy key с правом записи: SITE_DEPLOY_KEY здесь,
  # открытая половина — в deploy keys того репозитория. Заголовков Pages не дают и там:
  # CSP тегом, без frame-ancestors и COOP.
  deploy-web:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Две сборки подряд не должны толкаться в один репозиторий: вторая ждёт первую.
    concurrency:
      group: site-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ISKRA_BASE: /web/
          ISKRA_META_CSP: '1'
      - uses: actions/checkout@v5
        with:
          repository: iskra-app/iskra.swag.moscow
          ref: main
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      # web/ заменяется целиком: файлы прошлой сборки с другими хэшами не копятся.
      # Остальной сайт не трогается.
      - name: Положить сборку в web/
        run: |
          rm -rf site/web
          cp -R dist site/web
      - name: Опубликовать
        working-directory: site
        run: |
          git add -A web
          if git diff --cached --quiet; then
            echo "web/ не изменился"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "web: iskra-web ${GITHUB_SHA::7}" \
              -m "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push origin HEAD:main
